name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize and Assets
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          
          # Подготовка папки assets для генератора иконок
          mkdir -p assets
          cp icon.png assets/icon.png || true
          cp splash.png assets/splash.png || true

          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets
          
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android
          
          # Генерация всех ресурсов (иконка + заставка)
          npx capacitor-assets generate --android

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.bundle.enableSplit=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
