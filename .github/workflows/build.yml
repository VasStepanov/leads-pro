name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize and Assets
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          
          mkdir -p assets
          cp icon.png assets/icon.png || true
          cp splash.png assets/splash.png || true

          # Устанавливаем ядро и нужные плагины
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets @capacitor/status-bar@5.0.0 @capacitor/splash-screen@5.0.0 --force

          
          # Инициализируем проект
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json || true
          
          
          # Генерируем иконки и сплеш
          npx capacitor-assets generate --android
          find android/app/src/main/res/values* -name "*.xml" -exec sed -i 's/#ffffff/#9333ea/gI' {} +
          find android/app/src/main/res/values* -name "*.xml" -exec sed -i 's/@android:color\/white/#9333ea/gI' {} +
          
          # ВАЖНО: Синхронизируем плагины с андроид-проектом
          npx cap sync android

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.bundle.enableSplit=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
