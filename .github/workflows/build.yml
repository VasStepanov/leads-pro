name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize and Assets
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          
          mkdir -p assets
          cp icon.png assets/icon.png || true
          cp splash.png assets/splash.png || true

          # 1. Установка зависимостей
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets @capacitor/status-bar@5.0.0 @capacitor/splash-screen@5.0.0 --force
          
          # 2. Создание конфига
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.crmleadspro.app",
            "appName": "CRM Leads Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 30000,
                "launchAutoHide": false,
                "backgroundColor": "#9333ea",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "useDialog": true
              },
              "StatusBar": {
                "backgroundColor": "#9333ea",
                "style": "DARK"
              }
            }
          }
          EOF

          # 3. Добавление андроид-платформы
          npx cap add android
          
          # 4. Перезапись MainActivity.java (Создаем нативный "щит")
          mkdir -p android/app/src/main/java/com/crmleadspro.app/
          cat <<EOF > android/app/src/main/java/com/crmleadspro.app/MainActivity.java
          package com.crmleadspro.app;

          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private View shield;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Создаем фиолетовый щит
                  shield = new View(this);
                  shield.setBackgroundColor(Color.parseColor("#9333ea"));
                  shield.setLayoutParams(new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT));

                  // Накладываем его поверх WebView
                  addContentView(shield, shield.getLayoutParams());

                  // Слушаем событие 'removeShield' из JavaScript
                  this.getBridge().getWebView().evaluateJavascript(
                      "document.addEventListener('removeShield', function() { window.androidBridge.remove(); });", null);
                  
                  // Добавляем интерфейс для связи
                  this.getBridge().getWebView().addJavascriptInterface(new Object() {
                      @android.webkit.JavascriptInterface
                      public void remove() {
                          runOnUiThread(() -> {
                              if (shield != null) {
                                  ((ViewGroup)shield.getParent()).removeView(shield);
                                  shield = null;
                              }
                          });
                      }
                  }, "androidBridge");
              }
          }
          EOF
          
          # 5. Генерация иконок и сплеша
          npx capacitor-assets generate --android
          
          # 6. Глубокий патч системных XML
          cat <<EOF > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="white">#9333ea</color>
              <color name="background">#9333ea</color>
          </resources>
          EOF

          find android/app/src/main/res/values -name "*.xml" -exec sed -i 's/#ffffff/#9333ea/gI' {} +
          find android/app/src/main/res/values -name "styles.xml" -exec sed -i 's/windowBackground">@drawable\/splash/windowBackground">#9333ea/g' {} +
          
          # 7. Финальная синхронизация
          npx cap sync android

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.bundle.enableSplit=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
