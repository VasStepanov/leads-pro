name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize and Assets
        run: |
          mkdir -p www
          cp -r ./* www/ 2>/dev/null || true
          
          mkdir -p assets
          cp icon.png assets/icon.png || true
          cp splash.png assets/splash.png || true

          # 1. Установка зависимостей
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets @capacitor/status-bar@5.0.0 @capacitor/splash-screen@5.0.0 --force
          
          # 2. Создание конфига с параметром useDialog
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.crmleadspro.app",
            "appName": "CRM Leads Pro",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost"
            },
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 30000,
                "launchAutoHide": false,
                "backgroundColor": "#9333ea",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false,
                "splashFullScreen": true,
                "splashImmersive": true,
                "useDialog": true
              },
              "StatusBar": {
                "backgroundColor": "#9333ea",
                "style": "DARK"
              }
            }
          }
          EOF

          # 3. Добавление андроид-платформы
          npx cap add android
          
          # 4. Перезапись MainActivity.java для покраски WebView
          mkdir -p android/app/src/main/java/com/crmleadspro/app/
          cat <<EOF > android/app/src/main/java/com/crmleadspro/app/MainActivity.java
          package com.crmleadspro.app;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }
              @Override
              public void onStart() {
                  super.onStart();
                  WebView webView = this.getBridge().getWebView();
                  webView.setBackgroundColor(Color.parseColor("#9333ea"));
              }
          }
          EOF
          
          # 5. Генерация иконок и сплеша
          npx capacitor-assets generate --android
          
          # 6. Глубокий патч системных цветов и тем
          cat <<EOF > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="white">#9333ea</color>
              <color name="background">#9333ea</color>
          </resources>
          EOF

          find android/app/src/main/res/values -name "*.xml" -exec sed -i 's/#ffffff/#9333ea/gI' {} +
          find android/app/src/main/res/values -name "*.xml" -exec sed -i 's/@android:color\/white/#9333ea/gI' {} +
          find android/app/src/main/res/values -name "styles.xml" -exec sed -i 's/windowBackground">@drawable\/splash/windowBackground">#9333ea/g' {} +
          find android/app/src/main/res/values -name "styles.xml" -exec sed -i 's/windowBackground">@android:color\/white/windowBackground">#9333ea/g' {} +
          
          # 7. Финальная синхронизация
          npx cap sync android

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -Pandroid.bundle.enableSplit=true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final-Release
          path: android/app/build/outputs/apk/debug/app-debug.apk
