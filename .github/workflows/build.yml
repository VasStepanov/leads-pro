name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
        steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Files
        run: |
          mkdir -p www
          # Копируем всё, кроме папок с точкой и самой папки www
          cp -r assets index.html manifest.json sw.js www/ 2>/dev/null || true

      - name: Install Dependencies
        run: |
          npm install --no-package-lock
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

      - name: Initialize and Add Android
        run: |
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android

      - name: Sync and Build
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

