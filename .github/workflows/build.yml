name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Files
        run: |
          mkdir -p www
          cp -r index.html manifest.json www/ || true
          cp -r assets www/ || true
          cp -r sw.js www/ || true

      - name: Install Deps
        run: |
          npm install --no-package-lock
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0

      - name: Cap Init
        run: |
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android

      - name: Sync and Build
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
