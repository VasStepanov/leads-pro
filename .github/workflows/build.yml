name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets

      - name: Initialize
        run: |
          # Создаем рабочую директорию и копируем билд
          mkdir -p www
          cp -r index.html manifest.json *.json assets sw.js icon.png www/ || true
          
          # Инициализируем проект из папки www
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android
          
          # Генерация иконок
          if [ -f "icon.png" ]; then npx capacitor-assets generate --android; fi

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
