name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages # Берем файлы из ветки, куда ты делаешь deploy

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets

      - name: Initialize and Copy Files
        run: |
          # 1. Создаем папку www
          mkdir -p www
          
          # 2. Копируем всё содержимое из ветки gh-pages в www (включая папку mocks)
          # Используем точку, чтобы копирование было глубоким
          cp -R ./* www/ 2>/dev/null || true
          
          # 3. Инициализируем Capacitor
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android
          
          # 4. Генерируем иконки, если файл icon.png есть в корне
          if [ -f "icon.png" ]; then 
            npx @capacitor/assets generate --android
          fi

      - name: Build APK
        run: |
          # Синхронизируем папку www с проектом Android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
