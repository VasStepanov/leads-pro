name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare WWW
        run: |
          mkdir -p www
          # Копируем всё содержимое билда из ветки gh-pages в папку www
          # Используем ".", чтобы скопировать все скрытые файлы и подпапки
          cp -R . www/ || true
          # Удаляем из копии папку .github, чтобы она не попала в APK
          rm -rf www/.github

      - name: Install Dependencies
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets

      - name: Initialize Capacitor
        run: |
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir www
          npx cap add android
          # Генерируем иконки из icon.png
          if [ -f "www/icon.png" ]; then
            npx capacitor-assets generate --android --icon-path www/icon.png
          fi

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          # Собираем APK только для одной архитектуры (arm64), чтобы снизить вес
          ./gradlew assembleDebug -Pandroid.bundle.enableSplit=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
