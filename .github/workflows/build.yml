name: Build Android APK
on:
  push:
    branches: [ gh-pages ] # Сборка начнется, когда ты сделаешь deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: gh-pages # Берем файлы из ветки, куда улетел билд

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0 @capacitor/assets

      - name: Initialize
        run: |
          # Собираем прямо из корня ветки gh-pages
          npx cap init "CRM Leads Pro" com.crmleadspro.app --web-dir ./
          npx cap add android
          # Генерируем иконку, если она прилетела в gh-pages
          if [ -f "icon.png" ]; then npx capacitor-assets generate --android; fi

      - name: Build APK
        run: |
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CRM-Leads-Pro-Final
          path: android/app/build/outputs/apk/debug/app-debug.apk
